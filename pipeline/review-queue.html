<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PalaLab — Spec Review Queue</title>
<style>
  :root { --bg:#12181d; --card:#1a2229; --line:rgba(255,255,255,0.1); --txt:#e7edf2; --dim:#93a3af; --grn:#3f9e7c; --amb:#c8963d; --red:#c8695a; --blue:#4aa3d5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:Inter,system-ui,sans-serif; padding:24px; }
  h1 { font-size:19px; margin:0 0 4px; letter-spacing:0.02em; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:16px; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  input[type=file] { color:var(--dim); font-size:12px; }
  button { font-family:inherit; cursor:pointer; }
  .exp { padding:9px 14px; border-radius:9px; border:none; background:var(--blue); color:#08222f; font-weight:700; font-size:13px; }
  .exp:disabled { background:#2b3942; color:#6b7a86; cursor:default; }
  .stat { font-size:12px; color:var(--dim); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .chd { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .model { font-weight:700; font-size:14.5px; }
  .id { font-size:10.5px; color:#6b7a86; font-family:ui-monospace,monospace; }
  .badge { font-size:10px; font-weight:800; letter-spacing:0.05em; padding:2px 8px; border-radius:999px; text-transform:uppercase; }
  .b-conflict { background:rgba(200,105,90,0.2); color:var(--red); }
  .b-pending { background:rgba(200,150,61,0.2); color:var(--amb); }
  .field { border-top:1px solid var(--line); padding:10px 0 4px; }
  .flab { font-size:11px; font-weight:700; letter-spacing:0.05em; color:var(--dim); text-transform:uppercase; margin-bottom:6px; }
  .opt { display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:8px; cursor:pointer; }
  .opt:hover { background:rgba(255,255,255,0.03); }
  .val { font-family:ui-monospace,monospace; font-size:13px; }
  .src { font-size:10px; color:var(--dim); border:1px solid var(--line); border-radius:5px; padding:1px 6px; margin-left:auto; }
  .src.brand-verified,.src.brand { color:var(--grn); border-color:rgba(63,158,124,0.4); }
  .man { display:flex; gap:8px; align-items:center; }
  .man input[type=text] { background:#0f151a; border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:7px 9px; font-size:13px; width:150px; font-family:ui-monospace,monospace; }
  .man select { background:#0f151a; border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:7px; font-size:12px; }
  .empty { color:var(--dim); font-size:13px; padding:30px; text-align:center; }
</style></head>
<body>
  <h1>PalaLab — Spec Review Queue</h1>
  <div class="sub">Resolve conflicts (pick the right value) and fill pending fields. Export your decisions to feed back into the pipeline.</div>
  <div class="bar">
    <input type="file" id="file" accept="application/json">
    <span class="stat" id="stat"></span>
    <button class="exp" id="exp" disabled>Export resolutions</button>
  </div>
  <div id="list"><div class="empty">Load a <b>catalog.provenance.json</b> to begin.</div></div>

<script>
const CRIT = ["shapeId","thicknessMm","faceId","coreId","surfaceId","weightG","balanceCm"];
const LAB = { shapeId:"Shape", thicknessMm:"Thickness", faceId:"Face", coreId:"Core", surfaceId:"Surface", weightG:"Weight", balanceCm:"Balance", frameId:"Frame", bridgeId:"Bridge" };
const SRCS = ["brand-verified","brand","review-measured","retailer"];
const show = (v) => (v && typeof v === "object" && "min" in v) ? (v.min===v.max? v.min : v.min+"–"+v.max) : String(v);
let decisions = {};  // id -> field -> {value, source}

document.getElementById("file").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { render(JSON.parse(r.result)); } catch (err) { alert("Not valid JSON: " + err.message); } };
  r.readAsText(f);
});

function render(records) {
  decisions = {};
  const queue = records.filter((x) => x.status !== "published");
  const nc = queue.filter((x)=>x.status==="conflict").length, np = queue.filter((x)=>x.status==="pending").length;
  document.getElementById("stat").textContent = queue.length ? (queue.length+" to review · "+nc+" conflict · "+np+" pending") : "Nothing to review — all published.";
  document.getElementById("exp").disabled = queue.length===0;
  const list = document.getElementById("list");
  if (!queue.length) { list.innerHTML = '<div class="empty">✓ Every record is published. Nothing in the queue.</div>'; return; }
  list.innerHTML = "";
  for (const rec of queue) {
    const card = document.createElement("div"); card.className = "card";
    let h = '<div class="chd"><div><div class="model">'+rec.brand+' '+rec.model+' <span style="color:#6b7a86">('+rec.year+')</span></div><div class="id">'+rec.id+'</div></div>'+
            '<span class="badge b-'+rec.status+'">'+rec.status+'</span></div>';
    if (rec.status === "conflict") {
      for (const f of (rec.conflicts||[])) {
        const alts = (rec.alternatives||{})[f] || [];
        h += '<div class="field"><div class="flab">'+(LAB[f]||f)+' — disagreement</div>';
        alts.forEach((a,i) => {
          h += '<label class="opt"><input type="radio" name="'+rec.id+'|'+f+'" value="'+i+'"'+(i===0?' checked':'')+
               ' data-id="'+rec.id+'" data-field="'+f+'"><span class="val">'+show(a.value)+'</span>'+
               '<span class="src '+a.source+'">'+a.source+' · '+a.confidence+'</span></label>';
        });
        h += '</div>';
        decisions[rec.id] = decisions[rec.id] || {}; decisions[rec.id][f] = { value: alts[0]?.value, source: alts[0]?.source };
      }
    } else {  // pending: critical fields that are missing/low
      const needs = CRIT.filter((f) => { const p = rec[f]; return !p || p.confidence !== "high"; });
      for (const f of needs) {
        h += '<div class="field"><div class="flab">'+(LAB[f]||f)+' — missing / low confidence</div>'+
             '<div class="man"><input type="text" placeholder="enter value" data-id="'+rec.id+'" data-field="'+f+'" data-man="1">'+
             '<select data-id="'+rec.id+'" data-field="'+f+'" data-mansrc="1">'+SRCS.map(s=>'<option>'+s+'</option>').join('')+'</select></div></div>';
      }
    }
    card.innerHTML = h; list.appendChild(card);
  }
  // wire inputs
  list.querySelectorAll('input[type=radio]').forEach(el => el.addEventListener('change', () => {
    const id=el.dataset.id, f=el.dataset.field; const alts=(records.find(r=>r.id===id).alternatives||{})[f]; const a=alts[+el.value];
    decisions[id]=decisions[id]||{}; decisions[id][f]={value:a.value, source:a.source};
  }));
  const upd = (id,f) => { const t=list.querySelector('input[data-man][data-id="'+id+'"][data-field="'+f+'"]'); const s=list.querySelector('select[data-mansrc][data-id="'+id+'"][data-field="'+f+'"]');
    if(!t.value.trim()){ if(decisions[id])delete decisions[id][f]; return; } decisions[id]=decisions[id]||{}; decisions[id][f]={value:t.value.trim(), source:s.value}; };
  list.querySelectorAll('input[data-man]').forEach(el=>el.addEventListener('input',()=>upd(el.dataset.id,el.dataset.field)));
  list.querySelectorAll('select[data-mansrc]').forEach(el=>el.addEventListener('change',()=>upd(el.dataset.id,el.dataset.field)));
}

document.getElementById("exp").addEventListener("click", () => {
  const out = [];
  for (const id in decisions) for (const f in decisions[id]) if (decisions[id][f]) out.push({ id, field: f, value: decisions[id][f].value, source: decisions[id][f].source, resolvedBy: "reviewer", asOf: new Date().toISOString().slice(0,10) });
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "resolutions.json"; a.click();
});
</script>
</body></html>
